plugins { id 'com.android.application' }
def signingDirectory = System.getenv('PANDIYAN_SIGNING_DIR')
android {
    namespace 'com.pandiyanstore.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.pandiyanstore.app'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '2.0.2'
    }
    signingConfigs {
        if (signingDirectory) {
            release {
                storeFile file(signingDirectory + '/upload-keystore.p12')
                storePassword new File(signingDirectory, 'keystore-password.txt').text.trim()
                keyAlias 'upload'
                keyPassword storePassword
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        release {
            if (signingDirectory) signingConfig signingConfigs.release
            // R8 is off: the shrunk 2.0.1 build crashed on launch.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4' }

